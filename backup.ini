; 共用設定
[settings]
; 執行結果報告放哪（相對路徑以程式所在資料夾為準；不可放在任何一組的 dest 裡面）
report_dir = reports

; ------------------------------------------------------------
; 每一組備份目錄寫成一個區段，[ ] 裡是這組的名稱（自己取，console 與報告會用它標示）
;   src ：備份的正本
;   dest：執行後會變得與 src 完全相同（src 沒有的檔案會被刪掉）
; 要再加一組就照樣多寫一段，組數不限
; ------------------------------------------------------------

[test]
src = D:\GitHub\_kanyaochang\MirrorBackup
dest = D:\Backup\test

; [照片]
; src = D:\Photos
; dest = E:\Backup\Photos
